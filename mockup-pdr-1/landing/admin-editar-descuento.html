<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="main.css"><title>Editar descuento</title></head><body data-screen="operator-edit-discount" data-theme="travesia-natural"><main class="operator-shell"><section class="operator-content"><header class="operator-topbar"><div><p class="operator-eyebrow">Reglas comerciales</p><h1>Editar descuento</h1></div><a class="operator-outline" href="admin-descuentos.html" data-route="operatorDiscounts">Volver a descuentos</a></header><form class="operator-reservation-form" data-edit-discount-form><section class="operator-panel"><p class="operator-eyebrow">Parámetros del descuento</p><h2>Actualiza la promoción</h2><div class="operator-form-grid"><label>Servicio o producto<select data-discount-service required></select></label><label>Porcentaje de descuento<input data-discount-percentage required type="number" min="0" max="100" inputmode="numeric" /></label><label>Vigencia desde<input data-discount-start required type="date" /></label><label>Vigencia hasta<input data-discount-end required type="date" /></label><label>Prioridad<input data-discount-priority required type="number" min="1" step="1" /></label><label>Acumulable<select data-discount-stackable required><option value="no">No</option><option value="si">Sí</option></select></label><label>Tope del descuento<input data-discount-cap type="text" placeholder="Opcional, ej. $50.000" /></label><label>Base de cálculo<select data-discount-base required><option value="original">Valor original</option><option value="subtotal">Subtotal resultante del descuento anterior</option></select></label></div></section><p class="operator-form-feedback" data-discount-feedback>Actualiza los parámetros y guarda para aplicar los cambios a este mismo descuento.</p><div class="operator-form-actions"><a class="operator-outline" href="admin-descuentos.html" data-route="operatorDiscounts">Cancelar</a><button class="operator-primary" type="submit">Guardar cambios</button></div></form></section></main><script src="app.js"></script></body></html>
