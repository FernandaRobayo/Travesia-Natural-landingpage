<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tours | Multitour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css?v=20260901-3" />
  </head>
  <body data-screen="tours" data-theme="platform">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

    <main id="contenido" class="travel-tours-shell">
      <header class="travel-tours-header">
        <a class="travel-tours-brand" href="index.html" data-route="home">[Tu Marca]</a>

        <nav class="travel-tours-nav" aria-label="Navegacion principal del cliente">
          <a class="is-active" href="tours.html" data-route="tours">Explorar</a>
          <a href="alojamiento.html" data-route="lodging">Alojamiento</a>
          <a href="gastronomia.html" data-route="gastronomy">Gastronomía</a>
          <a href="panel-cliente.html" data-route="dashboard">Reservas</a>
          <a href="profile.html" data-route="profile">Perfil</a>
        </nav>
      </header>

      <section class="travel-tours-topbar">
        <a class="travel-tours-back" href="panel-cliente.html" data-route="dashboard">
          <span aria-hidden="true">&larr;</span>
          <span>Volver al panel cliente</span>
        </a>

        <div class="travel-tours-intro">
          <h1>Tours</h1>
          <p>Explora los tours disponibles y consulta sus detalles.</p>
        </div>

        <div class="travel-tours-search-row">
          <input type="search" aria-label="Buscar tours por nombre o destino" placeholder="Buscar tours por nombre o destino..." data-catalog-search />
          <button type="button" data-catalog-search-button>Buscar</button>
        </div>
      </section>

      <section class="travel-tours-grid" aria-label="Listado de tours disponibles" data-tours-grid></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
