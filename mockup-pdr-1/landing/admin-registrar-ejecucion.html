<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="main.css"><title>Registrar ejecución</title></head><body data-screen="operator-register-execution" data-theme="travesia-natural"><main class="operator-shell"><section class="operator-content"><header class="mt-page-header"><div class="mt-page-header-main"><p class="mt-page-header-eyebrow mt-caption">Seguimiento real</p><h1 class="mt-page-header-title mt-h1">Registrar ejecución</h1></div><a class="operator-outline mt-page-header-action" href="admin-operacion.html" data-route="operatorOperations">Volver a operación</a></header><form class="operator-reservation-form" data-execution-form><section class="operator-panel"><p class="operator-eyebrow">01. Reserva</p><h2>Datos reservados</h2><div class="operator-form-grid"><label>Reserva<input data-execution-code readonly type="text" /></label><label>Cliente<input data-execution-customer readonly type="text" /></label><label>Servicio<input data-execution-service readonly type="text" /></label><label>Fecha<input data-execution-date readonly type="text" /></label><label>Viajeros reservados<input data-execution-reserved readonly type="text" /></label></div></section><section class="operator-panel"><p class="operator-eyebrow">02. Ejecución real</p><h2>¿Se prestó el servicio?</h2><div class="operator-form-grid"><label>Resultado<select data-execution-served required><option value="">Selecciona una opción</option><option value="si">Sí, se prestó</option><option value="no">No se prestó</option></select></label><label data-execution-executed-field>Viajeros ejecutados<input data-execution-executed type="number" min="0" inputmode="numeric" /></label></div><label class="operator-form-wide" data-execution-causal-field>Causal de no prestación (obligatoria)<textarea data-execution-causal placeholder="Describe la causal por la cual el servicio no se prestó"></textarea></label></section><p class="operator-form-feedback" data-execution-feedback>Registra el resultado real de la ejecución.</p><div class="operator-form-actions"><a class="operator-outline" href="admin-operacion.html" data-route="operatorOperations">Cancelar</a><button class="operator-primary" type="submit">Registrar ejecución</button></div></form></section></main><script src="app.js"></script></body></html>
