<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="main.css"><title>Configurar hospedaje</title></head><body data-theme="travesia-natural"><main class="operator-shell"><section class="operator-content"><header class="operator-topbar"><div><p class="operator-eyebrow">Hospedaje</p><h1 data-config-title>Configurar hospedaje</h1></div><a class="operator-outline" href="admin-gestionar-hospedaje.html">Volver a hospedaje</a></header><form class="operator-reservation-form" data-configure-form="hospedaje-catalog-panel"><section class="operator-panel"><p class="operator-eyebrow">Capacidad y tarifa</p><h2>Datos del hospedaje</h2><p class="operator-copy">Estado actual <span class="operator-status" data-config-status></span></p><p class="operator-copy">El estado se cambia desde Activar/Desactivar en el listado.</p><div class="operator-form-grid"><label>Hospedaje<input data-field="name" required type="text" /></label><label>Capacidad (viajeros)<input data-field="capacity" required type="number" min="1" step="1" /></label><label>Tarifa base<input data-field="tariff" required type="text" /></label><label>Política de cupo<select data-field="policy" required><option>Confirmación directa solo con pago válido</option><option>Apartamiento temporal</option><option>Sin apartamiento previo</option></select></label><label>Vigencia desde<input data-field="validityStart" required type="date" /></label><label>Vigencia hasta<input data-field="validityEnd" required type="date" /></label></div></section><p class="operator-form-feedback" data-config-feedback>Los cambios se guardan sobre este mismo hospedaje; no se crea un registro nuevo.</p><div class="operator-form-actions"><a class="operator-outline" href="admin-gestionar-hospedaje.html">Cancelar</a><button class="operator-primary" type="submit">Guardar cambios</button></div></form></section></main><script src="app.js"></script></body></html>
