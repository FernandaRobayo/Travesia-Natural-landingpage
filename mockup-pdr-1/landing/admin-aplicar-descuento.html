<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="main.css"><title>Aplicar descuento</title></head><body data-screen="operator-apply-discount" data-theme="travesia-natural"><main class="operator-shell"><section class="operator-content"><header class="mt-page-header"><div class="mt-page-header-main"><p class="mt-page-header-eyebrow mt-caption">Descuento adicional</p><h1 class="mt-page-header-title mt-h1">Aplicar descuento</h1></div><a class="operator-outline mt-page-header-action" href="admin-reservas.html" data-route="operatorReservations">Volver a reservas</a></header><form class="operator-reservation-form" data-apply-discount-form><section class="operator-panel"><p class="operator-eyebrow">01. Reserva seleccionada</p><h2>Contexto de la reserva</h2><div class="operator-form-grid"><label>Reserva<input data-reservation-code-field readonly type="text" /></label><label>Cliente<input data-reservation-customer-field readonly type="text" /></label><label>Servicio<input data-reservation-service-field readonly type="text" /></label><label>Valor actual<input data-reservation-value-field readonly type="text" /></label></div></section><section class="operator-panel"><p class="operator-eyebrow">02. Descuento adicional</p><h2>Autorización</h2><div class="operator-form-grid"><label>Descuento adicional (%)<input data-adjustment-percentage required type="number" min="1" max="100" inputmode="numeric" /></label><label>Nuevo valor calculado<input data-adjustment-new-value readonly type="text" /></label><label class="operator-form-wide">Motivo (obligatorio)<textarea data-adjustment-reason required placeholder="Describe el motivo del descuento adicional"></textarea></label></div></section><p class="operator-form-feedback" data-apply-discount-feedback>Solo el Administrador puede autorizar descuentos adicionales; el motivo queda asociado a la reserva.</p><div class="operator-form-actions"><a class="operator-outline" href="admin-reservas.html" data-route="operatorReservations">Cancelar</a><button class="operator-primary" type="submit">Aplicar descuento</button></div></form></section></main><script src="app.js"></script></body></html>
