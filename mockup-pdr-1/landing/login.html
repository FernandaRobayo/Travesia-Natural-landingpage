<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Universal Tour Operator Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css?v=20260824-1" />
  </head>
  <body data-screen="login" data-theme="platform">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

    <main id="contenido" class="login-shell">
      <section class="login-visual-panel" aria-label="Presentación del producto">
        <div class="login-visual-overlay"></div>
        <div class="login-visual-content">
          <h1 data-copy="brandName">Universal Tour Operator Platform</h1>
          <div class="login-visual-copy">
            <h2 data-copy="loginHeroTitle">Una misma base para vender, operar y administrar experiencias.</h2>
            <p data-copy="loginHeroBody">Core compartido con identidad configurable por operador turístico.</p>
          </div>
        </div>
      </section>

      <section class="login-form-panel" aria-labelledby="login-title">
        <div class="login-card">
          <h2 id="login-title" data-copy="loginTitle">Iniciar sesión</h2>
          <p class="login-subtitle" data-copy="loginSubtitle">Accede al entorno operativo del sistema.</p>

          <div class="login-tabs" aria-label="Tipos de acceso">
            <button class="login-tab is-active" type="button" data-copy="loginTabOne">Acceso cliente</button>
            <button class="login-tab" type="button" data-copy="loginTabTwo">Staff / operación</button>
          </div>

          <form class="login-form" data-form="login" novalidate>
            <div class="login-field">
              <label for="login-id" data-copy="loginEmailLabel">Correo electrónico</label>
              <div class="login-input-wrap">
                <span class="login-input-icon" aria-hidden="true">@</span>
                <input
                  id="login-id"
                  name="login-id"
                  type="email"
                  autocomplete="email"
                  placeholder="ejemplo@correo.com"
                  required
                />
              </div>
            </div>

            <div class="login-field">
              <label for="login-password" data-copy="loginPasswordLabel">Contraseña</label>
              <div class="login-input-wrap">
                <span class="login-input-icon" aria-hidden="true">*</span>
                <input
                  id="login-password"
                  name="login-password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="........"
                  required
                />
              </div>
            </div>

            <div class="login-links">
              <a class="login-forgot-link" href="#" data-copy="loginForgotLink">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="login-submit" type="submit">
              <span data-copy="loginSubmit">Ingresar</span>
              <span aria-hidden="true">&rarr;</span>
            </button>

            <p class="feedback" data-feedback="login" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
