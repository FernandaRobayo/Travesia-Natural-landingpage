<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Multitour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css?v=20260830-1" />
  </head>
  <body data-screen="login" data-theme="platform">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

    <main id="contenido" class="travel-login-shell">
      <header class="travel-login-header">
        <a class="travel-login-brand" href="index.html" data-route="home">[Tu Marca]</a>
      </header>

      <section class="travel-login-stage">
        <div class="travel-login-card">
          <div class="travel-login-copy">
            <h1>Bienvenido de nuevo</h1>
            <p>Ingresa a tu cuenta para gestionar tus viajes.</p>
          </div>

          <div class="travel-login-role-switch" aria-label="Tipo de acceso">
            <button class="travel-login-role is-active" type="button" data-role-option="client" aria-pressed="true">
              Cliente
            </button>
            <button class="travel-login-role" type="button" data-role-option="staff" aria-pressed="false">
              Staff / operacion
            </button>
          </div>

          <form class="travel-login-form" data-form="login" novalidate>
            <div class="travel-login-field">
              <label for="login-id">Correo Electronico</label>
              <input
                id="login-id"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="correo@ejemplo.com"
              />
            </div>

            <div class="travel-login-field">
              <div class="travel-login-field-head">
                <label for="login-password">Contrasena</label>
                <a class="travel-login-help" href="recuperar.html" data-route="recover">Olvidaste tu contrasena?</a>
              </div>

              <div class="travel-login-password-wrap">
                <input
                  id="login-password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="..........."
                />
                <button class="travel-login-visibility" type="button" data-toggle="#login-password">Ver</button>
              </div>
            </div>

            <p class="feedback" data-feedback="login" aria-live="polite"></p>

            <button class="travel-login-submit" type="submit">
              <span>Iniciar Sesion</span>
            </button>
          </form>

          <div class="travel-login-divider"></div>

          <p id="soporte" class="travel-login-footer-note">
            No tienes una cuenta? <a href="crear-cuenta.html" data-route="signup">Crear cuenta</a>
          </p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
