<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pago exitoso | Multitour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css?v=20260901-3" />
  </head>
  <body data-screen="tour-payment-success" data-theme="platform">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

    <main id="contenido" class="travel-booking-page travel-payment-page">
      <section class="travel-payment-success-shell">
        <article class="travel-payment-success-card">
          <div class="travel-payment-success-icon" aria-hidden="true">✓</div>

          <div class="travel-payment-success-copy">
            <h1>Pago exitoso</h1>
            <p>
              Gracias por tu compra. Hemos enviado una confirmacion al correo
              registrado dentro del mockup.
            </p>
          </div>

          <div class="travel-payment-success-summary">
            <div class="travel-payment-success-media" data-success-image></div>

            <div class="travel-payment-success-details">
              <strong data-success-tour-name>Tour destino ejemplo</strong>
              <span data-success-date>09 Sep 2026</span>
              <span data-success-travelers>2 viajeros</span>
            </div>
          </div>

          <div class="travel-payment-success-ref">
            <span>Ref. reserva:</span>
            <strong data-success-code>#RES-000000</strong>
          </div>

          <div class="travel-payment-success-actions">
            <a class="travel-booking-continue" href="panel-cliente.html" data-route="dashboard">
              Ver mis tickets
            </a>
            <a class="travel-payment-secondary" href="index.html" data-route="home">
              Volver al inicio
            </a>
          </div>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
