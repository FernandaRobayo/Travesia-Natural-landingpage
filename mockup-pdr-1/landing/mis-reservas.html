<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis reservas | Multitour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css?v=20260901-3" />
  </head>
  <body data-screen="client-reservations" data-theme="platform">
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

    <main id="contenido" class="travel-dashboard-shell">
      <header class="travel-dashboard-header">
        <a class="travel-dashboard-brand" href="index.html" data-route="home" data-tenant-brand>Multitour</a>

        <div class="travel-dashboard-header-actions">
          <a class="travel-dashboard-header-link" href="panel-cliente.html" data-route="clientDashboard">Volver al panel</a>
          <a class="travel-dashboard-avatar" href="profile.html" data-route="profile" aria-label="Perfil del usuario" data-user-avatar>
            FN
          </a>
        </div>
      </header>

      <section class="travel-dashboard-hero" aria-labelledby="reservations-title">
        <div class="travel-dashboard-copy">
          <p class="travel-dashboard-eyebrow">Portal cliente</p>
          <h1 id="reservations-title">Mis reservas</h1>
          <p>Consulta el estado de tus reservas propias, activas y pasadas, dentro del operador actual.</p>
        </div>
      </section>

      <section class="travel-dashboard-section" aria-labelledby="reservations-list">
        <div class="travel-dashboard-section-head">
          <h2 id="reservations-list">Historial de reservas</h2>
        </div>

        <div class="travel-dashboard-reservation-grid" data-reservations-list></div>
        <p class="travel-dashboard-copy" data-reservations-empty hidden>Todavía no tienes reservas registradas. Explora el catálogo para crear la primera.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
