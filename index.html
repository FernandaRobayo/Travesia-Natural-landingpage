<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travesia Pages</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe4;
        --panel: #fffaf1;
        --ink: #183028;
        --muted: #53655e;
        --accent: #c46b2d;
        --border: #dccfb6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(circle at top, rgba(196, 107, 45, 0.16), transparent 32%),
          linear-gradient(180deg, #f8f3e8 0%, var(--bg) 100%);
        color: var(--ink);
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 72px 24px;
      }

      .hero,
      .card {
        background: rgba(255, 250, 241, 0.92);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(24, 48, 40, 0.08);
      }

      .hero {
        padding: 40px;
        margin-bottom: 24px;
      }

      h1,
      h2 {
        margin: 0 0 12px;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .card {
        padding: 24px;
      }

      .pill {
        display: inline-block;
        margin-bottom: 14px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(196, 107, 45, 0.12);
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      a {
        color: var(--ink);
        font-weight: 700;
      }

      a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <span class="pill">Travesia Pages</span>
        <h1>Publicaciones por subcarpeta</h1>
        <p>
          Esta raiz funciona como indice de entregables. Cada proyecto se publica
          en una carpeta independiente para no mezclar archivos ni rutas.
        </p>
      </section>

      <section class="grid" aria-label="Proyectos publicados">
        <article class="card">
          <span class="pill">Mockup</span>
          <h2>PDR 1</h2>
          <p>
            Primer contenido publicado desde la carpeta original
            <code>Landig Page</code>.
          </p>
          <p style="margin-top: 16px">
            <a href="./mockup-pdr-1/">Abrir mockup-pdr-1</a>
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
